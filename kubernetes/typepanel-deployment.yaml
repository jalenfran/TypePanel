apiVersion: apps/v1
kind: Deployment
metadata:
  name: typepanel
  namespace: typepanel
  labels:
    app: typepanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typepanel
  template:
    metadata:
      labels:
        app: typepanel
    spec:
      containers:
        - name: typepanel
          # Image hosted in GHCR, built from this repo
          image: ghcr.io/jalenfran/typepanel@sha256:64401cc732032eb1aed40e1716d6fbef7fd3bc30d2220fc5acdd16ccd481dd22
          # Digest-pinned 2026-10-13: Rust Yjs relay (the 10-03 pin was still the pre-Rust Node server).
          # :latest implies imagePullPolicy Always, which makes every pod restart
          # depend on the registry still serving that tag -- MinIO stopped doing
          # so and took aperture.jalencode.com down. Upgrade by changing the digest.
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: RUST_LOG
              value: "info"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
