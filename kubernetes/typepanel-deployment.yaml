apiVersion: apps/v1
kind: Deployment
metadata:
  name: typepanel
  namespace: typepanel
  labels:
    app: typepanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typepanel
  template:
    metadata:
      labels:
        app: typepanel
    spec:
      containers:
        - name: typepanel
          # Image hosted in GHCR, built from this repo
          image: ghcr.io/jalenfran/typepanel@sha256:ec3c68bd945193ea114e7ad1b3fbb16f957a075e056ccefa703561692315bd71
          # Digest-pinned 2026-10-03 (the digest then running and verified).
          # :latest implies imagePullPolicy Always, which makes every pod restart
          # depend on the registry still serving that tag -- MinIO stopped doing
          # so and took aperture.jalencode.com down. Upgrade by changing the digest.
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: RUST_LOG
              value: "info"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
